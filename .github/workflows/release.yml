name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild better-sqlite3 for Node (tests run under Node, not Electron)
        run: npm rebuild better-sqlite3

      - name: Verify (tests must pass to release)
        run: |
          npm run typecheck
          npm run test
          npm run build
          npm run build:main

      - name: Force-rebuild better-sqlite3 for the Electron ABI
        # electron-builder's internal rebuild skips modules whose .node binary
        # already exists (it does not verify the ABI), which shipped a Node-ABI
        # binary inside the installer and hung the app on "Loading FileMind…".
        # electron-rebuild -f downloads the electron-v130 prebuild, fixing that.
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Prepare code-signing arguments (skips automatically when secrets are absent)
        id: signing
        shell: bash
        env:
          # --- Azure Trusted Signing (recommended: instant SmartScreen reputation) ---
          AZURE_CODESIGN_ENDPOINT: ${{ secrets.AZURE_CODESIGN_ENDPOINT }}
          AZURE_CODESIGN_ACCOUNT: ${{ secrets.AZURE_CODESIGN_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          # Marker only ("true"/"false") so the step can report the mode without seeing the cert
          CSC_LINK_PRESENT: ${{ secrets.CSC_LINK != '' }}
        run: |
          ARGS=""
          if [ -n "$AZURE_CODESIGN_ENDPOINT" ] && [ -n "$AZURE_CODESIGN_ACCOUNT" ] && [ -n "$AZURE_CERT_PROFILE" ]; then
            ARGS="-c.win.azureSignOptions.endpoint=${AZURE_CODESIGN_ENDPOINT}"
            ARGS="${ARGS} -c.win.azureSignOptions.codeSigningAccountName=${AZURE_CODESIGN_ACCOUNT}"
            ARGS="${ARGS} -c.win.azureSignOptions.certificateProfileName=${AZURE_CERT_PROFILE}"
            echo "mode=azure-trusted-signing" >> "$GITHUB_OUTPUT"
          elif [ -n "$CSC_LINK_PRESENT" ]; then
            echo "mode=pfx-certificate" >> "$GITHUB_OUTPUT"
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Signing mode: $(cat "$GITHUB_OUTPUT" | grep '^mode=' | cut -d= -f2)"
        # CSC_LINK_PRESENT is just a marker so we can report the mode; the real
        # certificate is consumed by electron-builder via CSC_LINK below.

      - name: Package Windows installer
        run: npx electron-builder --win ${{ steps.signing.outputs.args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Option B: traditional PFX certificate (electron-builder native support) ---
          # Base64 of the .pfx file, e.g.  base64 -w0 mycert.pfx
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # --- Option A: Azure Trusted Signing (auth via EnvironmentCredential) ---
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Unsigned builds: electron-builder logs a warning and continues.

      - name: Verify packaged native module loads under the Electron ABI
        # Fails the release if better-sqlite3 inside the installer is not
        # loadable by Electron — the exact bug that caused the v0.1.0
        # "Loading FileMind…" hang. Note: electron.exe's exit code is
        # unreliable on Windows, so we match the success marker instead.
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $out = & .\node_modules\electron\dist\electron.exe -e "try { require('./release/win-unpacked/resources/app.asar.unpacked/node_modules/better-sqlite3'); console.log('NATIVE_OK: better-sqlite3 loads under Electron ABI'); } catch (e) { console.error('NATIVE_FAIL: ' + e.message); }" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'NATIVE_OK') { throw 'better-sqlite3 in the package is not built for the Electron ABI' }

      - name: Upload installers + zip to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
