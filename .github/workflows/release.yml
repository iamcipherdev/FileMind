name: Release

on:
  push:
    tags: ['v*']

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild better-sqlite3 for Node (tests run under Node, not Electron)
        run: npm rebuild better-sqlite3

      - name: Verify (tests must pass to release)
        run: |
          npm run typecheck
          npm run test
          npm run build
          npm run build:main

      - name: Force-rebuild better-sqlite3 for the Electron ABI
        # electron-builder's internal rebuild skips modules whose .node binary
        # already exists (it does not verify the ABI), which shipped a Node-ABI
        # binary inside the installer and hung the app on "Loading FileMind…".
        # electron-rebuild -f downloads the electron-v130 prebuild, fixing that.
        run: npx electron-rebuild -f -w better-sqlite3

      - name: Prepare code-signing arguments (skips automatically when secrets are absent)
        id: signing
        shell: bash
        env:
          # --- Azure Trusted Signing (recommended: instant SmartScreen reputation) ---
          AZURE_CODESIGN_ENDPOINT: ${{ secrets.AZURE_CODESIGN_ENDPOINT }}
          AZURE_CODESIGN_ACCOUNT: ${{ secrets.AZURE_CODESIGN_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          # Marker only ("true"/"false") so the step can report the mode without seeing the cert
          CSC_LINK_PRESENT: ${{ secrets.CSC_LINK != '' }}
        run: |
          ARGS=""
          if [ -n "$AZURE_CODESIGN_ENDPOINT" ] && [ -n "$AZURE_CODESIGN_ACCOUNT" ] && [ -n "$AZURE_CERT_PROFILE" ]; then
            ARGS="-c.win.azureSignOptions.endpoint=${AZURE_CODESIGN_ENDPOINT}"
            ARGS="${ARGS} -c.win.azureSignOptions.codeSigningAccountName=${AZURE_CODESIGN_ACCOUNT}"
            ARGS="${ARGS} -c.win.azureSignOptions.certificateProfileName=${AZURE_CERT_PROFILE}"
            echo "mode=azure-trusted-signing" >> "$GITHUB_OUTPUT"
          elif [ -n "$CSC_LINK_PRESENT" ]; then
            echo "mode=pfx-certificate" >> "$GITHUB_OUTPUT"
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Signing mode: $(cat "$GITHUB_OUTPUT" | grep '^mode=' | cut -d= -f2)"
        # CSC_LINK_PRESENT is just a marker so we can report the mode; the real
        # certificate is consumed by electron-builder via CSC_LINK below.

      - name: Package Windows installer
        run: npx electron-builder --win ${{ steps.signing.outputs.args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Option B: traditional PFX certificate (electron-builder native support) ---
          # Base64 of the .pfx file, e.g.  base64 -w0 mycert.pfx
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # --- Option A: Azure Trusted Signing (auth via EnvironmentCredential) ---
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Unsigned builds: electron-builder logs a warning and continues.

      - name: Verify packaged native module loads under the Electron ABI
        # Fails the release if better-sqlite3 inside the installer is not
        # loadable by Electron — the exact bug that caused the v0.1.0
        # "Loading FileMind…" hang. Note: electron.exe's exit code is
        # unreliable on Windows, so we match the success marker instead.
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $out = & .\node_modules\electron\dist\electron.exe -e "try { require('./release/win-unpacked/resources/app.asar.unpacked/node_modules/better-sqlite3'); console.log('NATIVE_OK: better-sqlite3 loads under Electron ABI'); } catch (e) { console.error('NATIVE_FAIL: ' + e.message); }" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'NATIVE_OK') { throw 'better-sqlite3 in the package is not built for the Electron ABI' }

      - name: Smoke-test the packaged app boots and stays alive (2 launch cycles)
        # STEP 9 — "do not call it fixed early": the packaged exe itself must
        # boot, stay alive, and reach "BOOTSTRAP COMPLETE" in
        # %TEMP%\FileMind-bootstrap.log. Run twice to prove a clean relaunch
        # (single-instance lock released, no leftover state blocking startup).
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP 'FileMind-bootstrap.log'
          $exe = Join-Path (Get-Location) 'release\win-unpacked\FileMind.exe'
          if (-not (Test-Path $exe)) { throw "packaged exe not found: $exe" }
          foreach ($run in 1..2) {
            Remove-Item $log -Force -ErrorAction SilentlyContinue
            Get-Process FileMind -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 15
            if ($p.HasExited) { throw "RUN ${run}: FileMind exited early (code $($p.ExitCode))" }
            if (-not (Test-Path $log)) { throw "RUN ${run}: bootstrap log was not created" }
            $content = Get-Content $log -Raw
            Write-Host $content
            if ($content -notmatch 'BOOTSTRAP COMPLETE') { throw "RUN ${run}: startup did not reach BOOTSTRAP COMPLETE" }
            Write-Host "RUN ${run}: OK — process alive and BOOTSTRAP COMPLETE reached"
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
          }
          Get-Process FileMind -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: End-to-end installed-app test (onboarding -> Home -> ML -> relaunch x5)
        # The real reproduction on the REAL installer: silent NSIS install,
        # clean user data, real onboarding (folder selection persisted),
        # Home mount, lightweight ml:status, isolated ML worker warmup with
        # packaged ONNX, explicit watcher opt-in, 30s dwell, graceful close
        # and 5 relaunch cycles. The release FAILS if any step does not pass.
        shell: pwsh
        run: |
          $setup = Get-ChildItem .\release -Filter '*.exe' | Where-Object { $_.Name -notmatch 'blockmap' } | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter 'FileMind.exe' -Recurse -Depth 2 | Select-Object -First 1
          if (-not $exe) { throw 'FileMind.exe not found after silent install' }
          "INSTALLED_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-Process FileMind -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:APPDATA\FileMind" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:TEMP 'FileMind-bootstrap.log') -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path 'C:\FileMindTest\SampleFolder' | Out-Null
          1..25 | ForEach-Object { Set-Content -Path "C:\FileMindTest\SampleFolder\note$_.txt" -Value "test file $_" }
          Start-Process -FilePath $exe.FullName -ArgumentList '--remote-debugging-port=9222'
          Start-Sleep -Seconds 6
          node scripts/e2e-driver.mjs --phase onboarding --folder "C:\FileMindTest\SampleFolder" --warmup --watch --wait-home-ms 45000
          Start-Sleep -Seconds 30
          if (-not (Get-Process FileMind -ErrorAction SilentlyContinue)) { throw 'PROCESS TERMINATED during 30s dwell on Home' }
          $log = Join-Path $env:TEMP 'FileMind-bootstrap.log'
          $c = Get-Content $log -Raw
          Write-Host $c
          foreach ($m in @('HOME_MOUNTED','ML_STATUS_REQUESTED','ML_WORKER_READY','ONNX_SESSION_SUCCESS','WATCHER_UPDATE_SUCCESS','E2E_HOME_VERIFIED')) {
            if ($c -notmatch "MARKER $m") { throw "missing marker: $m" }
          }
          if ($c -match 'FATAL during') { throw 'a fatal error was recorded during the E2E run — see bootstrap log above' }
          (Get-Process FileMind | Select-Object -First 1).CloseMainWindow() | Out-Null
          $deadline = (Get-Date).AddSeconds(15)
          while ((Get-Process FileMind -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          Get-Process FileMind -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          foreach ($i in 1..5) {
            Write-Host "=== relaunch $i ==="
            Start-Process -FilePath $exe.FullName
            Start-Sleep -Seconds 12
            if (-not (Get-Process FileMind -ErrorAction SilentlyContinue)) { throw "RELAUNCH ${i}: process terminated within 12s" }
            Start-Sleep -Seconds 18
            if (-not (Get-Process FileMind -ErrorAction SilentlyContinue)) { throw "RELAUNCH ${i}: process died before 30s" }
            Write-Host "relaunch ${i}: alive for 30s"
            (Get-Process FileMind | Select-Object -First 1).CloseMainWindow() | Out-Null
            $deadline = (Get-Date).AddSeconds(15)
            while ((Get-Process FileMind -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            Get-Process FileMind -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
          $c = Get-Content $log -Raw
          $homes = ([regex]::Matches($c, 'MARKER HOME_MOUNTED')).Count
          Write-Host "HOME_MOUNTED count across launches: $homes"
          if ($homes -lt 6) { throw "expected Home mount on onboarding + 5 relaunches, got $homes" }
          Write-Host 'END-TO-END INSTALLED TEST PASSED'

      - name: Upload installers + zip to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
