name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild better-sqlite3 for Node (tests run under Node, not Electron)
        run: npm rebuild better-sqlite3

      - name: Verify (tests must pass to release)
        run: |
          npm run typecheck
          npm run test
          npm run build
          npm run build:main

      - name: Package Windows installer
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers + zip to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
